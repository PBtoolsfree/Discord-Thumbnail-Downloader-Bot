services:
  bot:
    build: .
    image: pb-thumbnail-bot
    container_name: pb-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  setup:
    build: .
    image: pb-thumbnail-bot
    container_name: pb-setup
    restart: unless-stopped
    command: ["python", "-m", "app.web.setup"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    ports:
      - "${SETUP_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
