{% extends "layout.html" %}

{% block content %}
    <h1>⚙️ PB Thumbnail Bot Setup</h1>
    
    {% if success %}
    <div class="alert alert-success">
        {{ message }}
    </div>
    {% endif %}

    <form method="POST" action="/">
        <h2 class="section-title">Discord Configuration</h2>
        
        <div class="form-group">
            <label for="discord_token">Bot Token</label>
            <input type="password" id="discord_token" name="discord_token" value="{{ settings.discord_token }}" required>
            <div class="note">Keep this secret!</div>
        </div>
        
        <div class="form-group">
            <label for="discord_client_id">Client ID (Optional)</label>
            <input type="text" id="discord_client_id" name="discord_client_id" value="{{ settings.discord_client_id }}">
        </div>

        <div class="form-group">
            <label for="discord_guild_id">Guild/Server ID (Optional, for slash command sync)</label>
            <input type="text" id="discord_guild_id" name="discord_guild_id" value="{{ settings.discord_guild_id if settings.discord_guild_id else '' }}">
        </div>

        <div class="form-group">
            <label for="thumbnail_channel_id">Thumbnail Channel ID</label>
            <input type="text" id="thumbnail_channel_id" name="thumbnail_channel_id" value="{{ settings.thumbnail_channel_id if settings.thumbnail_channel_id else '' }}" required>
            <div class="note">The bot will only read links from this channel.</div>
        </div>

        <h2 class="section-title">Bot Settings</h2>
        
        <div class="form-group">
            <label for="max_urls_per_message">Max URLs per message</label>
            <input type="number" id="max_urls_per_message" name="max_urls_per_message" value="{{ settings.max_urls_per_message }}" min="1" max="20" required>
        </div>

        <div class="form-group">
            <label for="max_image_size_mb">Max Image Size (MB)</label>
            <input type="number" id="max_image_size_mb" name="max_image_size_mb" value="{{ settings.max_image_size_mb }}" min="1" max="50" required>
        </div>

        <div class="form-group">
            <label for="cache_ttl_hours">Cache Expiry (Hours)</label>
            <input type="number" id="cache_ttl_hours" name="cache_ttl_hours" value="{{ settings.cache_ttl_hours }}" min="1" required>
            <div class="note">Prevents redownloading the same thumbnail repeatedly.</div>
        </div>

        <button type="submit">Save & Restart Recommendation</button>
    </form>
{% endblock %}
